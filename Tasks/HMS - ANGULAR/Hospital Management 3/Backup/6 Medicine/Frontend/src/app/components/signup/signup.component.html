<div class="signup-container">
  <div class="signup-header">
    <button class="back-arrow-btn" (click)="goBack()" type="button">
      <span class="arrow-icon">←</span>
    </button>
    <div class="header-right">
      <div class="header-symbol">🏥</div>
      <div class="header-title">Create Account</div>
    </div>
  </div>

  <div *ngIf="registerError" class="alert alert-error">
    <span class="alert-icon">⚠️</span>
    <span class="alert-text">{{ registerError }}</span>
  </div>

  <div *ngIf="registerSuccess" class="alert alert-success">
    <span class="alert-icon">✓</span>
    <span class="alert-text">{{ registerSuccess }}</span>
  </div>

  <div class="form-wrapper" *ngIf="!registerRole">
    <div class="role-grid">
      <div *ngFor="let role of registrationRoles"
           class="role-card"
           [class.selected]="registerRole === role"
           (click)="chooseRole(role)">
        <span class="role-icon">{{ roleIcons[role] }}</span>
        <span class="role-name">{{ role }}</span>
        <p class="role-desc" [ngSwitch]="role">
          <span *ngSwitchCase="'Doctor'">Medical professional</span>
          <span *ngSwitchCase="'Nurse'">Healthcare support</span>
          <span *ngSwitchCase="'Patient'">Healthcare recipient</span>
        </p>
      </div>
    </div>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="submit()" class="form-wrapper" *ngIf="registerRole">
    <div class="form-grid">
      <div *ngFor="let field of getFormFields()" 
           [class.full-width]="field.type === 'text' && field.key === 'address'">
        <label [for]="field.key" class="form-label">
          {{ field.label }}
          <span *ngIf="field.required" class="required">*</span>
        </label>
        
        <input *ngIf="field.type !== 'select'"
          [id]="field.key"
          [type]="field.type"
          [placeholder]="field.placeholder"
          [formControlName]="field.key"
          [disabled]="isSubmitting"
          [class.error]="registerForm.get(field.key)?.invalid && registerForm.get(field.key)?.touched"
          class="form-input" />

        <select *ngIf="field.type === 'select'"
          [id]="field.key"
          [formControlName]="field.key"
          [disabled]="isSubmitting"
          [class.error]="registerForm.get(field.key)?.invalid && registerForm.get(field.key)?.touched"
          class="form-input">
          <option value="" disabled>Select {{ field.label }}</option>
          <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
        </select>

       
        <div *ngIf="registerForm.get(field.key)?.invalid && registerForm.get(field.key)?.touched" class="field-error">
          <span *ngIf="registerForm.get(field.key)?.errors?.['required']">{{ field.label }} is required</span>
          <span *ngIf="registerForm.get(field.key)?.errors?.['minlength']">Min length: {{ field.minLength }}</span>
          <span *ngIf="registerForm.get(field.key)?.errors?.['email']">Invalid email address</span>
        </div>
      </div>
    </div>

   
    <div class="form-actions">
      <button type="button" class="back-btn" (click)="goBack()" [disabled]="isSubmitting">Back</button>
      <app-button
        [type]="'submit'"
        [label]="isSubmitting ? 'Creating Account...' : 'Create Account'"
        [variant]="'primary'"
        [disabled]="isSubmitting || registerForm.invalid"
        [cssClass]="'btn-submit'">
      </app-button>
    </div>
  </form>
</div>
