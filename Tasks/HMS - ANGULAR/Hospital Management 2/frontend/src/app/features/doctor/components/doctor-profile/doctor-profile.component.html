<div class="profile-container">
  <div class="page-header">
    <h1>My Profile</h1>
  </div>

  <app-card title="Profile Information">
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" formControlName="firstName" class="form-control" />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" class="form-control" />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" formControlName="phone" class="form-control" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="specialization">Specialization</label>
          <input id="specialization" type="text" formControlName="specialization" class="form-control" />
        </div>
        <div class="form-group">
          <label for="experience">Experience (years)</label>
          <input id="experience" type="number" formControlName="experience" class="form-control" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="!profileForm.valid || (loading$ | async)" class="btn btn-primary">
          Save Changes
        </button>
      </div>
    </form>
  </app-card>
</div>
