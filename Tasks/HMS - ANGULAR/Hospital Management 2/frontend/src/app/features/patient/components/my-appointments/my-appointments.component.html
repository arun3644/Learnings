<div class="appointments-container">
  <div class="page-header">
    <h1>My Appointments</h1>
  </div>

  <app-card>
    <app-data-table
      [columns]="columns"
      [data]="(appointments$ | async) || []"
      [loading]="(loading$ | async) || false"
      (rowClick)="onRowClick($event)"
      (sort)="onSort($event)">
    </app-data-table>
  </app-card>
</div>
