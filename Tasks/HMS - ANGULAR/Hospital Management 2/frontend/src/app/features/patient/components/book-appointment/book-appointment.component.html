<div class="book-appointment-container">
  <div class="page-header">
    <h1>Book Appointment</h1>
  </div>

  <app-card title="Appointment Details">
    <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="doctorId">Select Doctor</label>
        <select id="doctorId" formControlName="doctorId" class="form-control">
          <option value="">Choose a doctor</option>
          @for (doctor of (doctors$ | async) || []; track doctor.id) {
            <option [value]="doctor.id">
              Dr. {{ doctor.firstName }} {{ doctor.lastName }} - {{ doctor.specialization }}
            </option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="appointmentDate">Date</label>
          <input id="appointmentDate" type="date" formControlName="appointmentDate" class="form-control" />
        </div>
        <div class="form-group">
          <label for="timeSlot">Time Slot</label>
          <select id="timeSlot" formControlName="timeSlot" class="form-control">
            <option value="">Select time</option>
            <option value="09:00-10:00">09:00 - 09:30</option>
            <option value="10:00-11:00">09:30 - 10:00</option>
            <option value="11:00-12:00">10:00 - 10:30</option>
            <option value="14:00-15:00">10:30 - 11:00</option>
            <option value="15:00-16:00">11:00 - 11:30</option>
            <option value="16:00-17:00">11:30 - 12:00</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reason">Reason for Visit</label>
        <textarea id="reason" formControlName="reason" class="form-control" rows="4" 
          placeholder="Describe your symptoms or reason for visit"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="!appointmentForm.valid || (loading$ | async)" class="btn btn-primary">
          Book Appointment
        </button>
      </div>
    </form>
  </app-card>
</div>
