<div class="login-container">
  <div class="login-card">
    <h2>Hospital Management System</h2>
    <h3>Login</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          id="username" 
          type="text" 
          formControlName="username" 
          placeholder="Enter username"
        />
        <div class="error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Enter password"
        />
        <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters
        </div>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" formControlName="role">
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>

      <div class="error" *ngIf="error$ | async as error">
        {{ error }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || (loading$ | async)">
        <span *ngIf="!(loading$ | async)">Login</span>
        <span *ngIf="loading$ | async">Loading...</span>
      </button>

      <div class="register-link">
        Don't have an account? 
        <a (click)="navigateToRegister()">Register here</a>
      </div>
    </form>
  </div>
</div>
