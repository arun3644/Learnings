# Server Configuration
server.port=8080

# Application Name
spring.application.name=practice-springboot

# Database Configuration (RDS)
spring.datasource.url=jdbc:postgresql://hospital-db.cmpgiskuml99.us-east-1.rds.amazonaws.com:5432/hospital
spring.datasource.username=postgres
spring.datasource.password=Hospital123!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Logging Level
logging.level.root=INFO
logging.level.com.hospital=DEBUG

# CORS Configuration
cors.allowed.origins=http://localhost:4200

# Jackson Configuration (to include empty arrays in JSON response)
spring.jackson.serialization.write-empty-json-arrays=true
spring.jackson.default-property-inclusion=always
